services:
  postgres:
    image: postgres:16-alpine
    container_name: lubricentro-gyg-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lubricentro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lubricentro_gyg}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lubricentro} -d ${POSTGRES_DB:-lubricentro_gyg}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lubricentro-gyg-api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lubricentro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lubricentro_gyg}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-8h}
      PORT: '3000'
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lubricentro-gyg-web
    ports:
      - '80:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
