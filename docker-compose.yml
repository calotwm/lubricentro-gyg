services:
  postgres:
    image: postgres:16-alpine
    container_name: lubricentro-gyg-db
    environment:
      POSTGRES_USER: lubricentro
      POSTGRES_PASSWORD: lubricentro_dev
      POSTGRES_DB: lubricentro_gyg
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lubricentro -d lubricentro_gyg']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
